<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 140 }}">
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 140 }}">
<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
<meta name="theme-color" content="#f8f7fa">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cg fill='none' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M13.5 20A6.5 2.9 0 0 1 26.5 20' transform='rotate%2846.5 20 20%29' stroke='%23EA580C' stroke-width='2.4'/%3E%3Cpath d='M10 10.5H30L10 29.5H30' stroke='%231F1B2D' stroke-width='5.5'/%3E%3Cpath d='M26.5 20A6.5 2.9 0 0 1 13.5 20' transform='rotate%2846.5 20 20%29' stroke='%23EA580C' stroke-width='2.6'/%3E%3Cpath d='M24.5 24.7Q29 21.5 35.5 22.5' stroke='%23EA580C' stroke-width='2.4'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,800&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
<div class="wrap">
  <nav>
    <a class="mark" href="{{ '/' | relative_url }}" aria-label="Zestloom 처음으로">
      <svg viewBox="0 0 40 40" aria-hidden="true"><g fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 20A6.5 2.9 0 0 1 26.5 20" transform="rotate(46.5 20 20)" stroke="#EA580C" stroke-width="2.4"/><path d="M10 10.5H30L10 29.5H30" stroke="currentColor" stroke-width="5.5"/><path d="M26.5 20A6.5 2.9 0 0 1 13.5 20" transform="rotate(46.5 20 20)" stroke="#EA580C" stroke-width="2.6"/><path d="M24.5 24.7Q29 21.5 35.5 22.5" stroke="#EA580C" stroke-width="2.4"/></g></svg>
      <span><b>zest</b>loom</span>
    </a>
    <ul>
      <li><a href="{{ '/#work' | relative_url }}">만든 것</a></li>
      <li><a href="{{ '/blog/' | relative_url }}">소식</a></li>
      <li><a href="{{ '/#studio' | relative_url }}">소개</a></li>
      <li><a href="{{ '/#contact' | relative_url }}">문의</a></li>
    </ul>
  </nav>
</div>

{{ content }}

<footer>
  <div class="wrap">
    <span>© {{ site.time | date: "%Y" }} Zestloom</span>
    <ul>
      <li><a href="https://honeycomb-893c5.web.app/privacy" target="_blank" rel="noopener">개인정보 처리방침</a></li>
      <li><a href="https://honeycomb-893c5.web.app/terms" target="_blank" rel="noopener">이용약관</a></li>
      <li><a href="https://honeycomb-893c5.web.app/delete-account" target="_blank" rel="noopener">계정 삭제 안내</a></li>
    </ul>
  </div>
</footer>
<script src="{{ '/assets/site.js' | relative_url }}"></script>
</body>
</html>
